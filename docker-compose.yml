version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-prosp
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: "Indian/Antananarivo"
      TZ: "Indian/Antananarivo"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # URL interne pour joindre flaresolverr depuis n8n (via le nom du service)
      FLARESOLVERR_URL: "http://flaresolverr:8191"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_net
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr-prosp
    restart: unless-stopped
    environment:
      LOG_LEVEL: "info"
    ports:
      # Mappe le port interne 8191 vers 8989 sur l'hôte, pour tests locaux
      - "127.0.0.1:8989:8191"
    networks:
      - n8n_net
  
  react-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile.dev
    container_name: frontend-prosp
    restart: unless-stopped
    ports:
      # Accessible depuis la machine hôte sur http://localhost:5173
      - "5173:5173"
    volumes:
      # Hot-reload : le code local est monté dans le conteneur
      - ./frontend-app:/app
      - /app/node_modules
    environment:
      # Utilisée depuis le NAVIGATEUR (sur l'hôte) -> doit passer par le port mappé,
      # pas par le nom du service Docker (qui n'est résolvable qu'entre conteneurs)
      VITE_N8N_WEBHOOK_URL: "http://localhost:5678/webhook/prospect-form"
    networks:
      - n8n_net
    depends_on:
      - n8n

networks:
  n8n_net:
    driver: bridge

volumes:
  n8n_data:
